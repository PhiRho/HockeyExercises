[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.envs.test]
dependencies = [
    "pytest"
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "src"

[project]
name = "hockey-exercise"
version = "2025.01.23"
dependencies = [
    "fastapi[standard]",
    "hatch",
]
